name: ryot-dev

x-node-volumes: &node-volumes
  - .:/app:z
  - node-root:/app/node_modules
  - node-frontend:/app/apps/frontend/node_modules
  - node-docs:/app/apps/docs/node_modules
  - node-website:/app/apps/website/node_modules
  - node-extension:/app/apps/browser-extension/node_modules
  - node-generated:/app/libs/generated/node_modules
  - node-graphql:/app/libs/graphql/node_modules
  - node-transactional:/app/libs/transactional/node_modules
  - node-utils:/app/libs/ts-utils/node_modules
  - node-tests:/app/tests/node_modules
  - yarn-cache:/root/.yarn
  - yarn-state:/yarn-state

services:
  db:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: ryot_dev
      POSTGRES_USER: ryot_dev
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryot_dev -d ryot_dev"]
      interval: 2s
      timeout: 5s
      retries: 30

  dependencies:
    image: docker.io/library/node:24-trixie-slim@sha256:8ec5d7557396cfe32d21c3f9c13072355ceab22b584578ca4bb28af31120cffe
    working_dir: /app
    volumes: *node-volumes
    environment:
      TURBO_TELEMETRY_DISABLED: "1"
      YARN_INSTALL_STATE_PATH: /yarn-state/install-state.gz
    command:
      - sh
      - -ec
      - |
        node .yarn/releases/yarn-4.1.1.cjs install --immutable
        node .yarn/releases/yarn-4.1.1.cjs turbo run build --filter=@ryot/transactional
        if ! diff -qr libs/transactional/out crates/services/notification/templates >/dev/null; then
          node .yarn/releases/yarn-4.1.1.cjs workspace @ryot/transactional copy-templates
        fi

  backend:
    build:
      context: .
      dockerfile: ci/dev/Dockerfile
    init: true
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      dependencies:
        condition: service_completed_successfully
    environment:
      APP_VERSION: v10.4.2-fork.2
      DATABASE_URL: postgres://ryot_dev:local-development-only@db:5432/ryot_dev
      SERVER_BACKEND_HOST: 0.0.0.0
      SERVER_BACKEND_PORT: "5000"
      SERVER_ADMIN_ACCESS_TOKEN: local-development-only-admin-token
      SERVER_DISABLE_BACKGROUND_JOBS: "true"
      DISABLE_TELEMETRY: "true"
      FRONTEND_URL: http://127.0.0.1:8800
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "1"
      CARGO_TARGET_DIR: /cargo-target
    volumes:
      - .:/app:z
      - cargo-target:/cargo-target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    tmpfs:
      - /runtime

  frontend:
    image: docker.io/library/node:24-trixie-slim@sha256:8ec5d7557396cfe32d21c3f9c13072355ceab22b584578ca4bb28af31120cffe
    init: true
    working_dir: /app
    depends_on:
      dependencies:
        condition: service_completed_successfully
    volumes: *node-volumes
    environment:
      API_URL: http://backend:5000
      TURBO_TELEMETRY_DISABLED: "1"
      YARN_INSTALL_STATE_PATH: /yarn-state/install-state.gz
    command: ["node", ".yarn/releases/yarn-4.1.1.cjs", "turbo", "run", "dev:container", "--filter=@ryot/frontend"]

  proxy:
    image: docker.io/library/caddy:2.9.1
    ports:
      - "127.0.0.1:8800:8000"
    volumes:
      - ./ci/dev/Caddyfile:/etc/caddy/Caddyfile:ro,z

volumes:
  database:
    name: ryot-fork-dev-data
  cargo-target:
  cargo-registry:
  cargo-git:
  yarn-cache:
  yarn-state:
  node-root:
  node-frontend:
  node-docs:
  node-website:
  node-extension:
  node-generated:
  node-graphql:
  node-transactional:
  node-utils:
  node-tests:
